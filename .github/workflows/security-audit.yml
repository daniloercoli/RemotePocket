name: Security and Tests

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: mydesk
          POSTGRES_PASSWORD: mydesk-test-only
          POSTGRES_DB: mydesk_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U mydesk -d mydesk_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      MYDESK_TEST_REDIS_URL: redis://localhost:6379/0
      MYDESK_TEST_POSTGRES_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg2://mydesk:mydesk-test-only@localhost:5432/mydesk_test' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Server/requirements.lock
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install backup encryption tools
        run: sudo apt-get update && sudo apt-get install -y age
      - name: Install backend and test dependencies
        working-directory: Server
        run: |
          python -m pip install --upgrade 'pip>=26.2'
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -e '.[dev]'
      - name: Run backend and console regressions
        working-directory: Server
        run: |
          python -m ruff check app tests scripts --select F
          python -m pytest -q
          node --test tests/*.test.cjs

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install audit tools
        run: python -m pip install --upgrade 'pip>=26.2' 'pip-audit>=2.10' 'bandit>=1.9'
      - name: Audit source and locked runtime dependencies
        run: Server/scripts/security-check.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: security-reports
          path: Server/security-reports/
          retention-days: 30

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan history and working tree without online credential verification
        run: Server/scripts/scan-secrets.sh

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.136.0
    steps:
      - uses: actions/checkout@v5
      - name: Scan Python, JavaScript and Kotlin
        run: semgrep scan --config p/python --config p/javascript --config p/kotlin --error --metrics=off --exclude 'Server/tests' --exclude 'Android/app/src/test' .

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          # Override the default list, which includes the unavailable legacy tools package.
          packages: 'platform-tools platforms;android-35'
      - uses: gradle/actions/setup-gradle@v5
      - name: Test and build Android
        working-directory: Android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon

  production-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install backup encryption tools
        run: sudo apt-get update && sudo apt-get install -y age
      - name: Build and verify HTTPS stack
        run: Server/scripts/test-production.sh

  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate monitoring configuration and error-rate alert
        run: |
          monitoring_token_file="$(mktemp)"
          trap 'rm -f "$monitoring_token_file"' EXIT
          echo 'ci-only-monitoring-credential-not-a-deployment-secret' > "$monitoring_token_file"
          chmod 644 "$monitoring_token_file"
          docker run --rm --entrypoint promtool -v "$PWD/Server/monitoring:/etc/prometheus:ro" -v "$monitoring_token_file:/run/secrets/mydesk_monitoring_token:ro" prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool -w /etc/prometheus -v "$PWD/Server/monitoring:/etc/prometheus:ro" prom/prometheus:v3.5.0 test rules alert-rules.test.yml
