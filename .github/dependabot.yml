version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/Server"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"

  - package-ecosystem: "gradle"
    directory: "/Android"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/Server"
    schedule:
      interval: "weekly"
