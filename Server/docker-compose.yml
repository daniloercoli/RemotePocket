# Local dependencies. Run the Python backend on the host with Server/.env.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: mydesk_dev
      POSTGRES_USER: mydesk
      POSTGRES_PASSWORD: ${MYDESK_DEV_DB_PASSWORD:?Set MYDESK_DEV_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mydesk -d mydesk_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_dev:
