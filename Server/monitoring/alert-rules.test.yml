rule_files:
  - alert-rules.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'http_requests_total{job="mydesk",method="GET",endpoint="/api/devices",status="500"}'
        values: '0+10x15'
      - series: 'http_requests_total{job="mydesk",method="GET",endpoint="/api/devices",status="200"}'
        values: '0+90x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: MyDeskHighErrorRate
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: MyDesk HTTP error rate exceeds 5%
