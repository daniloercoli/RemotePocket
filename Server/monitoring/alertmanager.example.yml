global:
  resolve_timeout: 5m
route:
  receiver: operations
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
receivers:
  - name: operations
    webhook_configs:
      # Configure a verified recipient before enabling this file in your deployment.
      - url: 'https://alerts.example.com/mydesk'
        send_resolved: true
