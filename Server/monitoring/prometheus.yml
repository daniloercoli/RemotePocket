global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alert-rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: mydesk
    scheme: https
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/mydesk_monitoring_token
    static_configs:
      # Replace with the actual public MYDESK_DOMAIN; certificate validation stays enabled.
      - targets: ['desk.example.com']
