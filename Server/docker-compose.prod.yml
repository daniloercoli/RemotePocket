# Standalone production stack: docker compose -f docker-compose.prod.yml up -d --build
services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mydesk_prod
      POSTGRES_USER: mydesk_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mydesk_user -d mydesk_prod"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]
  app:
    build: .
    restart: unless-stopped
    environment:
      MYDESK_ENVIRONMENT: prod
      MYDESK_DEBUG: "false"
      MYDESK_PUBLIC_BASE_URL: https://${MYDESK_DOMAIN:?Set MYDESK_DOMAIN}
      MYDESK_SMTP_HOST: ${MYDESK_SMTP_HOST:-}
      MYDESK_SMTP_PORT: ${MYDESK_SMTP_PORT:-587}
      MYDESK_SMTP_FROM: ${MYDESK_SMTP_FROM:-}
      MYDESK_SMTP_USERNAME: ${MYDESK_SMTP_USERNAME:-}
      MYDESK_SMTP_TLS: ${MYDESK_SMTP_TLS:-starttls}
      FORWARDED_ALLOW_IPS: "*"
      MYDESK_LOG_LEVEL: ${MYDESK_LOG_LEVEL:-INFO}
      MYDESK_METRICS_ENABLED: ${MYDESK_METRICS_ENABLED:-true}
      MYDESK_MONITORING_TOKEN: ${MYDESK_MONITORING_TOKEN:-}
      MYDESK_HEALTH_CHECK_TIMEOUT_SECONDS: ${MYDESK_HEALTH_CHECK_TIMEOUT_SECONDS:-3}
      MYDESK_TRACING_ENABLED: ${MYDESK_TRACING_ENABLED:-true}
      MYDESK_TRACING_ENDPOINT: ${MYDESK_TRACING_ENDPOINT:-}
      MYDESK_TRACING_PROTOCOL: ${MYDESK_TRACING_PROTOCOL:-http}
      MYDESK_TRACING_INSECURE: ${MYDESK_TRACING_INSECURE:-false}
      MYDESK_SHUTDOWN_TIMEOUT_SECONDS: ${MYDESK_SHUTDOWN_TIMEOUT_SECONDS:-30}
      MYDESK_WEBSOCKET_DRAIN_TIMEOUT_SECONDS: ${MYDESK_WEBSOCKET_DRAIN_TIMEOUT_SECONDS:-10}
      MYDESK_REDIS_URL: redis://redis:6379/0
      MYDESK_CORS_ALLOWED_ORIGINS: https://${MYDESK_DOMAIN:?Set MYDESK_DOMAIN}
    secrets:
      - MYDESK_ENCRYPTION_KEY
      - MYDESK_SMTP_PASSWORD
      - MYDESK_SECRET_KEY
      - MYDESK_DATABASE_URL
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Only nginx can reach the upstream; it overwrites forwarded headers.
    command: ["python", "-m", "app.server"]
    stop_grace_period: 150s
    networks: [backend, frontend]
    security_opt: ["no-new-privileges:true"]
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "${MYDESK_HTTP_PORT:-80}:80"
      - "${MYDESK_HTTPS_PORT:-443}:443"
    environment:
      MYDESK_DOMAIN: ${MYDESK_DOMAIN:?Set MYDESK_DOMAIN}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ${MYDESK_TLS_DIR:?Set MYDESK_TLS_DIR}:/etc/nginx/ssl:ro
      - ${MYDESK_ACME_DIR:?Set MYDESK_ACME_DIR}:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [frontend]
secrets:
  postgres_password:
    file: ${MYDESK_SECRETS_DIR:?Set MYDESK_SECRETS_DIR}/postgres_password
  MYDESK_ENCRYPTION_KEY:
    file: ${MYDESK_SECRETS_DIR:?Set MYDESK_SECRETS_DIR}/MYDESK_ENCRYPTION_KEY
  MYDESK_SMTP_PASSWORD:
    file: ${MYDESK_SECRETS_DIR:?Set MYDESK_SECRETS_DIR}/MYDESK_SMTP_PASSWORD
  MYDESK_SECRET_KEY:
    file: ${MYDESK_SECRETS_DIR:?Set MYDESK_SECRETS_DIR}/MYDESK_SECRET_KEY
  MYDESK_DATABASE_URL:
    file: ${MYDESK_SECRETS_DIR:?Set MYDESK_SECRETS_DIR}/MYDESK_DATABASE_URL
volumes:
  postgres_data:
  redis_data:
networks:
  backend:
    internal: true
  frontend:
