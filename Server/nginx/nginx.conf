# Loaded by the official nginx image's envsubst template entrypoint.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
map $uri $monitoring_request {
    default 0;
    ~^/(metrics|api/health/(ready|advanced))/?$ 1;
}
map "$monitoring_request:$http_authorization" $monitoring_without_credentials {
    default 0;
    "1:" 1;
}
# Preserve the application's configurable CSP. Edge-generated errors have no
# upstream headers and need a policy of their own.
map $upstream_http_content_security_policy $response_csp {
    "" "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'";
    default $upstream_http_content_security_policy;
}
map $scheme $transport_security {
    https "max-age=31536000; includeSubDomains";
    default "";
}
# Shared by HTTPS responses, HTTP redirects and errors generated by nginx.
# An empty HSTS value is omitted on HTTP.
add_header Strict-Transport-Security $transport_security always;
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cache-Control no-store always;
add_header Content-Security-Policy $response_csp always;
# Omit query strings so legacy clients cannot leak URL credentials into access logs.
log_format mydesk '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server_tokens off;

server {
    # Override the inherited combined log, which includes query strings and headers.
    access_log /var/log/nginx/access.log mydesk;
    # nginx error logs cannot redact request URLs; failures remain in access status codes.
    error_log /dev/null;
    listen 80;
    server_name ${MYDESK_DOMAIN};
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://${MYDESK_DOMAIN}$request_uri; }
}
server {
    # Override the inherited combined log, which includes query strings and headers.
    access_log /var/log/nginx/access.log mydesk;
    # nginx error logs cannot redact request URLs; failures remain in access status codes.
    error_log /dev/null;
    listen 443 ssl;
    http2 on;
    server_name ${MYDESK_DOMAIN};
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # Reject anonymous diagnostic requests at the edge; the app validates the token.
    if ($monitoring_without_credentials) { return 401; }
    client_max_body_size 64k;
    client_body_timeout 15s;
    gzip on;
    gzip_types text/css application/javascript application/json;
    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cache-Control;
        proxy_hide_header Content-Security-Policy;
    }
}
