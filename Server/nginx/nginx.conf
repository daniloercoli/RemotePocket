# Loaded by the official nginx image's envsubst template entrypoint.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
map $uri $monitoring_request {
    default 0;
    ~^/(metrics|api/health/(ready|advanced))/?$ 1;
}
map "$monitoring_request:$http_authorization" $monitoring_without_credentials {
    default 0;
    "1:" 1;
}
# Omit query strings: browser WebSocket URLs contain access tokens.
log_format mydesk '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
access_log /var/log/nginx/access.log mydesk;
server_tokens off;

server {
    listen 80;
    server_name ${MYDESK_DOMAIN};
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://${MYDESK_DOMAIN}$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name ${MYDESK_DOMAIN};
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # Reject anonymous diagnostic requests at the edge; the app validates the token.
    if ($monitoring_without_credentials) { return 401; }
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 64k;
    client_body_timeout 15s;
    gzip on;
    gzip_types text/css application/javascript application/json;
    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
    }
}
